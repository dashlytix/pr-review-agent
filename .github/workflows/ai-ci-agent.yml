# Runs the agent when the CI workflow completes, per ADR-001 §1: the
# trigger is CI completion, not a PR being opened. A passing run gets a
# short templated comment (no LLM call); a failing run gets the full
# gather -> assess -> diagnosis pipeline. The pull_request trigger below
# is unrelated to review -- it only drives Slack lifecycle notifications
# (opened/closed/merged).
name: AI CI Agent

on:
  workflow_run:
    # Must match the `name:` of ci.yml, not its filename.
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [opened, closed]

# The repo-wide default is read-only; the agent has to write a PR comment.
# Granting this here, in the workflow, rather than repo-wide keeps the
# token's authority scoped to the one job that needs it -- and §6.1 wants
# posting authority fixed before any contributor-influenceable content
# (logs, diffs) is ever read.
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ci-result:
    # Act once CI has concluded, on either outcome; any other conclusion
    # (cancelled/skipped/timed_out) has nothing to post. False (not an
    # error) on the pull_request trigger too, since
    # github.event.workflow_run doesn't exist there.
    if: github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          llm-provider: claude
          # Calls Anthropic's API directly -- the exe.dev gateway
          # (llm.int.exe.xyz) returns 402 "LLM credits exhausted" for
          # this account, so llm-base-url is left unset to fall back to
          # https://api.anthropic.com. Only reached on a failing run --
          # a passing run's short templated comment never calls the LLM.
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-model: claude-opus-5
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  pull-request:
    # Opened/closed/merged Slack lifecycle pings only -- review is gated
    # entirely on CI completion above, not on this trigger.
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          llm-provider: claude
          # Required by action.yml even though this job's code path never
          # reaches the LLM -- only the Slack lifecycle ping fires here.
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-model: claude-opus-5
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
