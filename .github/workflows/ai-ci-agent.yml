# Runs the agent after CI fails, per ADR-001 §1: the trigger is a CI
# failure, not a PR being opened. The pull_request trigger below is a
# second, independent purpose: threaded Slack lifecycle notifications
# (opened/closed/merged, one thread per PR) plus a full code review on
# opened/synchronize -- both handled by main.go's single pull_request
# event path in one job/container run, since each action needs at most
# one of the two.
name: AI CI Agent

on:
  workflow_run:
    # Must match the `name:` of ci.yml, not its filename.
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, closed]

# The repo-wide default is read-only; the agent has to write a PR comment.
# Granting this here, in the workflow, rather than repo-wide keeps the
# token's authority scoped to the one job that needs it -- and §6.1 wants
# posting authority fixed before any contributor-influenceable content
# (logs, diffs) is ever read.
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  investigate:
    # Only act on a CI failure; a passing run has nothing to diagnose,
    # and this condition is false (not an error) on the pull_request
    # trigger too, since github.event.workflow_run doesn't exist there.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          llm-provider: openai
          # Routed through OpenRouter (an OpenAI-wire-format-compatible
          # gateway, per action.yml's llm-base-url description) instead
          # of the default claude two-tier chain (llm-proxy primary /
          # direct-Anthropic fallback): llm-proxy's VM integration is
          # broken gateway-side, and the direct-Anthropic fallback's
          # workspace has no funded credit balance. OpenRouter needs its
          # own funded key (OPENROUTER_API_KEY) and a namespaced model
          # id -- unlike llm-provider: claude, there's no built-in
          # fallback tier here, so a failure here has nothing further to
          # degrade to but the fallback comment.
          llm-base-url: https://openrouter.ai/api/v1
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          llm-model: openai/gpt-4o-mini
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL_ID }}

  pull-request:
    # Opened/closed/merged Slack pings, plus a full code review on
    # opened/synchronize -- main.go dispatches on the action internally,
    # so one job/container run covers whichever of the two this action
    # needs (closed needs only the Slack ping; opened needs both).
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          llm-provider: openai
          # Required by action.yml even though "closed" never reaches the
          # LLM (only the Slack ping) -- "opened"/"synchronize" do, for
          # the code review. Same OpenRouter routing as the investigate
          # job above -- see the comment there for why.
          llm-base-url: https://openrouter.ai/api/v1
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          llm-model: openai/gpt-4o-mini
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL_ID }}
