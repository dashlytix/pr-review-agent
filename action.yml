name: 'ai-ci-agent'
description: 'Investigates a CI failure and posts a root-cause comment'
inputs:
  llm-provider:
    description: 'claude | openai | ...'
    default: 'claude'
  llm-api-key:
    required: true
  llm-proxy-api-key:
    description: 'API key for the llm-proxy GPT primary tier used by the default claude two-tier chain (https://llm-proxy.int.exe.xyz/). Only required when llm-provider is claude (default) and llm-base-url is unset; direct-Anthropic fallback still uses llm-api-key.'
  llm-base-url:
    description: 'Override the provider API endpoint to use an API-compatible gateway (e.g. OpenRouter, or a self-hosted proxy). Accepts a bare host, a /v1 prefix, or a fully qualified path. If unset, the provider''s own API is used.'
  llm-model:
    description: 'Override the model the selected provider requests. Required for the default claude two-tier chain (the llm-proxy GPT model has no safe default); openai defaults to gpt-4o-mini if unset.'
  llm-fallback-model:
    description: 'Override the model sent to the default claude two-tier chain''s direct-Anthropic fallback tier only. If unset, defaults to claude-sonnet-5. Has no effect for openai, or when llm-base-url is set.'
  github-token:
    description: 'Token used to read run context and post the PR comment'
    default: '${{ github.token }}'
  slack-webhook-url:
    description: 'Slack incoming webhook URL. If unset, Slack notifications are disabled entirely.'
outputs:
  comment-url:
    description: 'URL of the PR comment this run posted (or found already existing)'
  comment-body:
    description: 'Full markdown body of the posted comment, for forwarding to other destinations (e.g. chat notifications)'
runs:
  using: 'docker'
  image: 'Dockerfile'
